    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (
            msg.indexOf('[vite] failed to connect') !== -1 ||
            (msg.indexOf('[vite]') === 0 && (msg.toLowerCase().indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1))
          )) {
            return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>

    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ethio_biz_helper_theme') || localStorage.getItem('ethio_theme');
          var theme = raw ? (raw.startsWith('"') ? JSON.parse(raw) : raw) : 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

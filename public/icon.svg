<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ethioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Top Tricolor Pill -->
  <rect x="180" y="56" width="152" height="12" rx="6" fill="url(#ethioGrad)"/>

  <!-- Store Roof / Canopy -->
  <path d="M120 180 L256 100 L392 180 Z" fill="url(#goldGrad)"/>
  <rect x="110" y="180" width="292" height="24" rx="8" fill="#f59e0b"/>
  
  <!-- Store Columns & Body -->
  <rect x="144" y="204" width="36" height="150" rx="4" fill="#38bdf8"/>
  <rect x="238" y="204" width="36" height="150" rx="4" fill="#38bdf8"/>
  <rect x="332" y="204" width="36" height="150" rx="4" fill="#38bdf8"/>

  <!-- Store Foundation -->
  <rect x="110" y="354" width="292" height="28" rx="6" fill="#f59e0b"/>

  <!-- Golden Coin / Birr Emblem in Center -->
  <circle cx="256" cy="279" r="44" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3"/>
  <text x="256" y="293" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" fill="#0f172a" text-anchor="middle">ETB</text>

  <!-- App Title Text -->
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ETHIO HELPER</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#f59e0b" text-anchor="middle">የንግድ ረዳት</text>
</svg>
